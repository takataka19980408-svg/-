<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/-/baccarat-manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/-/icon-192.png" />
    <link rel="apple-touch-icon" href="/-/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07100c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="バカラ卓" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>バカラ卓 運用記録</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #07100c;
        height: 100%;
        height: 100dvh;
      }
      #root {
        height: 100%;
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/baccarat-main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          const reg = await navigator.serviceWorker.register('/-/baccarat-sw.js', { scope: '/-/baccarat/' });
          // 開いたままのタブやホーム画面アプリが新しいデプロイに気づかず
          // 古いバンドルを表示し続けないよう、定期的に更新を確認し、
          // 新しいService Workerが有効になったらページを再読み込みする。
          navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
          const checkForUpdate = () => reg.update().catch(() => {});
          setInterval(checkForUpdate, 60000);
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') checkForUpdate();
          });
        });
      }
    </script>
  </body>
</html>
